name: 🐛 Bug report
description: Report a reproducible bug in ChatbotLite.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        Before submitting, please check existing issues to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: ChatbotLite version
      description: Run `npm view chatbotlite version` for the latest, and check your `package.json` for yours.
      placeholder: "0.7.21"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, OS, Node version if server-side.
      placeholder: "Chrome 138 / macOS 15 / Node 20.11"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A CodeSandbox / StackBlitz link, or the smallest code snippet that reproduces the issue.
      placeholder: |
        ```tsx
        <ChatWidget endpoint="/api/chat" ... />
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include console errors, network failures, screenshots if useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I've searched existing issues
          required: true
        - label: I'm on the latest `chatbotlite` version (or noted why I can't upgrade)
          required: true
